name: Build

on:
  push:
    branches:
      - main
      - 'review/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run Java tests
        run: mvn -B clean test

      - name: Run MiniApi JavaScript tests
        run: node src/test/js/mini-api.test.js

      - name: Build runtime distribution
        run: mvn -B clean package

      - name: Verify runtime distribution
        id: distribution
        shell: bash
        run: |
          shopt -s nullglob
          archives=(target/mini-server-*.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one Mini Server distribution ZIP, found ${#archives[@]}." >&2
            exit 1
          fi

          bash scripts/verify-distribution.sh "${archives[0]}"
          echo "zip=${archives[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${archives[0]}" .zip)" >> "$GITHUB_OUTPUT"

      - name: Upload runtime distribution
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.distribution.outputs.name }}-${{ github.sha }}
          path: ${{ steps.distribution.outputs.zip }}
          if-no-files-found: error
